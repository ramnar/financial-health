# Settings for the dashboard. Edit the values; keep the section names as they are.

# ── Recommended allocation ranges per asset class (% of portfolio) ───────────
# Source: RR2FF "Portfolio Balance Status" page — that page loads its cards in
# iframes, so these are copied by hand. Update when your advisor revises them.
# Leave low/high empty when there is no recommendation.

[Equity]
low = 44
high = 58

[Debt]
low = 32
high = 46

[Commodities]
low = 6
high = 11

[Crypto]
low = 0
high = 5

[Real Estate]
low =
high =

# ── Official inflation ───────────────────────────────────────────────────────
# Year-on-year CPI inflation, compared with your household inflation.
# Update from MoSPI's monthly CPI release (All India, Combined).

[CPI]
annual_inflation_pct = 4.0
as_of = Oct 2026

# ── Financial independence ───────────────────────────────────────────────────
# target_amount: the corpus (₹) at which you'd consider yourself independent.
#   Set at 25 × annual spend: ₹97,484/month × 12 × 25 = ₹2,92,45,200.
# expected_real_return_pct: yearly return after inflation, used for the projected date.

[Financial Independence]
target_amount = 69245200
expected_real_return_pct = 8

# ── Emergency fund ───────────────────────────────────────────────────────────
# assets: comma-separated names exactly as in the RR2FF portfolio split.
# minimum_months: months of average spending these assets should cover.

[Emergency Fund]
assets = ExpenseFund, Mutual Fund Debt
minimum_months = 6
